# Vigila el estado de la suscripcion de Azure mientras esta bloqueada por facturacion.
# Cada hora consulta el estado con la identidad OIDC del despliegue (sin secretos de
# Azure). Cuando pasa a "Enabled", envia un correo por Brevo, abre un issue de respaldo
# y se desactiva solo, para no repetir el aviso. Repo publico: los minutos no cuestan.
# Para volver a vigilar: Actions > Vigilar suscripcion de Azure > Enable workflow.
name: Vigilar suscripcion de Azure

on:
  schedule:
    - cron: "17 * * * *" # cada hora, minuto 17
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  issues: write
  actions: write # para desactivar este mismo flujo tras avisar

jobs:
  vigilar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Iniciar sesion en Azure
        id: login
        # Si la suscripcion esta deshabilitada el login puede fallar: cuenta como
        # "sigue bloqueada" y no como error (evita un correo de fallo cada hora).
        continue-on-error: true
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Consultar el estado
        id: estado
        if: steps.login.outcome == 'success'
        continue-on-error: true
        run: |
          ESTADO=$(az rest --method get \
            --url "https://management.azure.com/subscriptions/${{ vars.AZURE_SUBSCRIPTION_ID }}?api-version=2022-12-01" \
            --query state -o tsv)
          echo "Estado de la suscripcion: $ESTADO"
          echo "valor=$ESTADO" >> "$GITHUB_OUTPUT"

      - name: Avisar por correo (Brevo)
        if: steps.estado.outputs.valor == 'Enabled'
        continue-on-error: true
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          MAIL_FROM_ADDRESS: ${{ secrets.MAIL_FROM_ADDRESS }}
          MAIL_FROM_NAME: ${{ secrets.MAIL_FROM_NAME }}
          CORREO_DESTINATARIO: ${{ secrets.CORREO_DESTINATARIO }}
        run: |
          jq -n \
            --arg de "$MAIL_FROM_ADDRESS" --arg nombre "$MAIL_FROM_NAME" --arg para "$CORREO_DESTINATARIO" \
            '{sender:{email:$de,name:$nombre}, to:[{email:$para}],
              subject:"Azure: la suscripción ya está activa",
              htmlContent:"<p>La suscripción de Azure volvió a estado <b>Enabled</b>.</p><p>Ya se pueden crear el presupuesto con alertas y redesplegar las Container Apps desde GitHub.</p>"}' \
          | curl --fail --silent --show-error -X POST https://api.brevo.com/v3/smtp/email \
              -H "api-key: $BREVO_API_KEY" -H "content-type: application/json" -d @-

      - name: Abrir issue de respaldo
        if: steps.estado.outputs.valor == 'Enabled'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Azure: la suscripción ya está activa" \
            --body "El vigilante detectó la suscripción en estado **Enabled**. Siguiente paso: presupuesto con alertas y redespliegue de las Container Apps."

      - name: Desactivar este vigilante
        if: steps.estado.outputs.valor == 'Enabled'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow disable vigilar-azure.yml --repo "$GITHUB_REPOSITORY"
