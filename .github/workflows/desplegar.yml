# Despliegue continuo: cada push a main publica la imagen en GitHub
# Container Registry (gratis para paquetes publicos) y actualiza la
# Container App. La URL publica de la demo no cambia: es de la Container App.
# Los cambios solo de documentacion no despliegan.
name: Desplegar en Azure Container Apps

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: produccion
  cancel-in-progress: false

env:
  IMAGEN: ghcr.io/lariasca1994/calidad-afiliaciones
  APP: calidad-afiliaciones
  GRUPO: PersonalEAN

jobs:
  desplegar:
    runs-on: ubuntu-latest
    # OIDC: sin secretos. La identidad solo tiene el rol
    # "Container Apps Contributor" sobre esta Container App.
    permissions:
      id-token: write
      contents: read
      packages: write
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      # Pruebas del acceso (recuperacion de contrasena, "Perdi mi autenticador",
      # nombre visible). Sin base ni correo reales; si fallan, no se publica.
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Pruebas
        run: |
          pip install -r requirements.txt pytest httpx
          python -m pytest -q tests

      - name: Iniciar sesion en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar la imagen
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGEN }}:${{ github.sha }}
            ${{ env.IMAGEN }}:latest

      # La Container App descarga la imagen sin credenciales: si el paquete
      # quedara privado, la nueva revision no arrancaria. Se corta aqui y la
      # demo sigue con la version anterior.
      - name: Verificar que la imagen es publica
        run: |
          docker logout ghcr.io
          docker manifest inspect "$IMAGEN:${{ github.sha }}" > /dev/null || {
            echo "::error::El paquete $IMAGEN es privado. Hacerlo publico en GitHub (Package settings > Change visibility) y relanzar."
            exit 1
          }

      - name: Iniciar sesion en Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # El correo de recuperacion de cuenta (API de Brevo) se configura desde
      # los secretos y variables del repositorio: nada se edita a mano en Azure.
      - name: Actualizar la Container App
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_REMITENTE: ${{ secrets.BREVO_REMITENTE }}
          URL_PUBLICA: ${{ vars.URL_PUBLICA }}
        run: |
          az containerapp update \
            --name "$APP" \
            --resource-group "$GRUPO" \
            --image "$IMAGEN:${{ github.sha }}" \
            --cpu 0.25 --memory 0.5Gi \
            --set-env-vars \
              "BREVO_API_KEY=$BREVO_API_KEY" \
              "BREVO_REMITENTE=$BREVO_REMITENTE" \
              "URL_PUBLICA=$URL_PUBLICA" \
            --only-show-errors \
            --query "properties.latestRevisionName" -o tsv

      # Base de datos (TiDB Cloud): host, puerto, usuario, contraseña y base
      # vienen de los secretos del repositorio; la contraseña queda como
      # secreto de la Container App. Sin esos secretos este paso no cambia nada.
      # También retira las variables del proveedor anterior.
      - name: Configurar la base de datos
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
        run: |
          if [ -z "$DB_HOST" ] || [ -z "$DB_PASSWORD" ]; then
            echo "Sin secretos DB_*: se conserva la configuración de base actual."
            exit 0
          fi
          az containerapp secret set --name "$APP" --resource-group "$GRUPO" \
            --secrets "db-password=$DB_PASSWORD" --only-show-errors -o none
          viejas=$(az containerapp show --name "$APP" --resource-group "$GRUPO" \
            --query "properties.template.containers[0].env[?starts_with(name, 'AIVEN_')].name" -o tsv | tr '\n' ' ')
          az containerapp update --name "$APP" --resource-group "$GRUPO" \
            --set-env-vars "DB_HOST=$DB_HOST" "DB_PORT=$DB_PORT" "DB_USER=$DB_USER" \
              "DB_NAME=$DB_NAME" "DB_SSL=true" "DB_PASSWORD=secretref:db-password" \
            ${viejas:+--remove-env-vars $viejas} \
            --only-show-errors --query "properties.latestRevisionName" -o tsv
          for s in $(az containerapp secret list --name "$APP" --resource-group "$GRUPO" \
              --query "[?starts_with(name, 'aiven')].name" -o tsv); do
            az containerapp secret remove --name "$APP" --resource-group "$GRUPO" \
              --secret-names "$s" --only-show-errors -o none
          done
