{% extends "base.html" %}
{% block titulo %}Crear cuenta — Calidad de Afiliaciones{% endblock %}
{% block contenido %}
<div class="w-full max-w-sm bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-lg shadow-sm p-8">
    <h1 class="text-xl font-bold mb-2 text-center">Crear cuenta</h1>
    <p class="text-sm text-slate-500 dark:text-slate-400 text-center mb-6">
        Cada cuenta genera y ve solo sus propios datos de ejemplo.
    </p>
    {% if error %}
    <div class="bg-rose-50 dark:bg-rose-900/30 text-rose-600 dark:text-rose-300 text-sm rounded px-3 py-2 mb-4">{{ error }}</div>
    {% endif %}
    <form method="post" action="/registro" class="space-y-4">
        <div>
            <label class="block text-sm font-medium mb-1">Correo</label>
            <input type="email" name="email" required
                   class="w-full rounded border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-mysql" />
        </div>
        <div>
            <label class="block text-sm font-medium mb-1">Contraseña</label>
            <input type="password" name="password" required
                   class="w-full rounded border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-mysql" />
        </div>
        <div>
            <label class="block text-sm font-medium mb-1">Confirmar contraseña</label>
            <input type="password" name="confirmar" required
                   class="w-full rounded border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-mysql" />
        </div>
        <button type="submit" class="w-full bg-mysql hover:bg-mysql-dark text-white font-semibold rounded py-2">Crear cuenta</button>
    </form>
    <p class="text-sm text-center text-slate-500 dark:text-slate-400 mt-5">
        ¿Ya tienes cuenta? <a href="/login" class="text-mysql hover:text-mysql-dark font-medium">Inicia sesión</a>
    </p>
</div>
{% endblock %}
